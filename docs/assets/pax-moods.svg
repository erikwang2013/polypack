<svg width="890" height="247" viewBox="0 0 890 247" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pax-moods-t pax-moods-d">
  <title id="pax-moods-t">Pax 的五种表情（各自带动态）— 笑 / 哭 / 惊恐 / 疑惑 / 眨眼</title>
  <desc id="pax-moods-d">邮差蟹 Pax 的头部特写联系表：五种表情及中英文标签，每个形态各自带有专属动效（笑=浮动、哭=泪滴、惊恐=发抖加汗滴、疑惑=问号浮动、眨眼=定期眨眼）。</desc>
  <style>.cell-blink .pax-blink-open { opacity: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .cell-happy .pax-crab { animation: pax-bob 3s ease-in-out infinite; }
    .cell-cry .pax-crab { animation: pax-bob 4s ease-in-out -0.45s infinite; }
    .cell-cry .pax-tear-a { animation: pax-tear 1.15s ease-in infinite; }
    .cell-cry .pax-tear-b { animation: pax-tear 1.15s ease-in 0.2s infinite; }
    .cell-shock .pax-crab { animation: pax-shiver 0.16s linear infinite; }
    .cell-shock .pax-sweat { animation: pax-drip 1.4s ease-in infinite; }
    .cell-confused .pax-crab { animation: pax-bob 3.4s ease-in-out -1.35s infinite; }
    .cell-confused .pax-question { animation: pax-float 2.2s ease-in-out infinite; }
    .cell-blink .pax-crab { animation: pax-bob 3.2s ease-in-out -1.80s infinite; }
    .cell-blink .pax-blink-open { animation: pax-blink-open 3.2s linear infinite; }
    .cell-blink .pax-blink-shut { animation: pax-blink-shut 3.2s linear infinite; }
  }
  @keyframes pax-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes pax-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes pax-tear { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(30px); opacity: 0; } }
  @keyframes pax-shiver { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-1.6px); } 75% { transform: translateX(1.6px); } }
  @keyframes pax-drip { 0% { transform: translateY(0); opacity: 0.3; } 40% { opacity: 1; } 100% { transform: translateY(12px); opacity: 0; } }
  @keyframes pax-blink-open { 0%, 87% { opacity: 1; } 88.5%, 93% { opacity: 0; } 94.5%, 100% { opacity: 1; } }
  @keyframes pax-blink-shut { 0%, 87% { opacity: 0; } 88.5%, 93% { opacity: 1; } 94.5%, 100% { opacity: 0; } }</style>

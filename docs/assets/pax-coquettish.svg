<svg width="640" height="384" viewBox="0 0 720 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pax-t pax-d">
  <title id="pax-t">Pax · 打包机器人 — 撒娇表情（动态）</title>
  <desc id="pax-d">PolyPack 项目宠物 Pax 的撒娇表情（coy），带该表情专属的 CSS 动效；减弱动态效果时定格为静态形态。</desc>
  <style>@media (prefers-reduced-motion: no-preference) {
    .pax-bot { transform-origin: 300px 300px; animation: pax-sway 3s ease-in-out infinite; }
    .pax-heart-a { animation: pax-heart 2.4s ease-out infinite; }
    .pax-heart-b { animation: pax-heart 2.4s ease-out 1.2s infinite; }
  }
  @keyframes pax-sway { 0%, 100% { transform: rotate(-1.8deg); } 50% { transform: rotate(1.8deg); } }
  @keyframes pax-heart { 0% { opacity: 0; transform: translateY(8px) scale(0.7); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-22px) scale(1.05); } }
  </style>


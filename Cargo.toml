[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/erikwang2013/polypack"

[workspace.dependencies]
poly-bundle = { path = "crates/poly-bundle" }
poly-cache = { path = "crates/poly-cache" }
poly-core = { path = "crates/poly-core" }
poly-publish = { path = "crates/poly-publish" }
poly-sign = { path = "crates/poly-sign" }
poly-targets = { path = "crates/poly-targets" }
poly-toolchain = { path = "crates/poly-toolchain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
base64 = "0.22"
blake3 = "1"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
# deny（而非 forbid）：T-M6-02 的 C ABI 模块需要显式 #[allow(unsafe_code)] 处理 C 指针边界；
# 其余代码不写 allow 即禁止 unsafe。
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

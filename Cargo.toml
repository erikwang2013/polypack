[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/erikwang2013/polypack"

[workspace.dependencies]
poly-bundle = { path = "crates/poly-bundle" }
poly-cache = { path = "crates/poly-cache" }
poly-core = { path = "crates/poly-core" }
poly-targets = { path = "crates/poly-targets" }
poly-toolchain = { path = "crates/poly-toolchain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
blake3 = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

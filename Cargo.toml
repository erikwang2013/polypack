[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.16.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/erikwang2013/polypack"
# 根 README 随包发布（cargo 以 workspace 根为基准解析该路径）。
readme = "README.md"
keywords = ["polypack", "packaging", "build-tool", "cross-platform", "mobile"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[workspace.dependencies]
# version 是 crates.io 发布所需（path 依赖在打包时被替换为 registry 版本）。
polypack-bundle = { version = "1.16.0", path = "crates/polypack-bundle" }
polypack-cache = { version = "1.16.0", path = "crates/polypack-cache" }
polypack-core = { version = "1.16.0", path = "crates/polypack-core" }
polypack-plugin = { version = "1.16.0", path = "crates/polypack-plugin" }
polypack-publish = { version = "1.16.0", path = "crates/polypack-publish" }
polypack-sign = { version = "1.16.0", path = "crates/polypack-sign" }
polypack-targets = { version = "1.16.0", path = "crates/polypack-targets" }
polypack-toolchain = { version = "1.16.0", path = "crates/polypack-toolchain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
base64 = "0.22"
blake3 = "1"
semver = "1"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
# T-M8-01 插件沙箱：仅组件模型 + Cranelift + 运行时/标准库；关掉默认的
# async / GC / pooling / cache / profiling / WAT 等特性（体积与编译重）。
# 版本钉死：wasmtime 的 C API / 组件 ABI 随小版本演进，沙箱边界不接受漂移。
wasmtime = { version = "=49.0.4", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }

[workspace.lints.rust]
# deny（而非 forbid）：T-M6-02 的 C ABI 模块需要显式 #[allow(unsafe_code)] 处理 C 指针边界；
# 其余代码不写 allow 即禁止 unsafe。
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

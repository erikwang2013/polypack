# BSD 原生构建 + 安装冒烟（T-M5-09）：仅每夜与手动触发——QEMU VM 成本不进每提交 / PR。
#
# - freebsd 腿（真跑）：vmactions/freebsd-vm@v1（14.5 x86_64）内构建 poly，
#   `poly build --target freebsd` 产出 .pkg → `poly release --target freebsd`（一次性
#   RSA 密钥，CI 专用）刷新并签名 pkg 仓库 → `pkg update/install/check -s` 消费签名仓库；
#   第二跑断言 cache_hit=true / runs=2 / 仓库字节不变。日志与仓库/回执/包全部归档。
# - openbsd 腿（尽力真跑）：vmactions/openbsd-vm@v1（7.9 x86_64）内构建 poly 与 ports
#   骨架；ports 树就绪后 `make package` → `pkg_add` → `pkg_check`。make 腿失败按
#   SKIP-with-print 注记（T-M5-09 评估：镜像带宽不足，本地未真跑；以 CI 结果为准）。
#
# 为什么是 VM 不是交叉编译：pkg / ports / signify 只在 BSD 用户态存在（T-M5-09 评估结论）。

name: bsd-ci

on:
  schedule:
    # 每夜：与 mobile-contract（18:37）/ miniprogram-contract（18:47）/
    # tv-smoke（18:57）/ bridge（19:23）错峰
    - cron: "7 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd:
    name: freebsd / 14.5 / qemu
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: FreeBSD VM（原生构建 + .pkg 安装冒烟）
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.5"
          arch: x86_64
          mem: 6144
          cpu: 4
          copyback: true
          cache-after-prepare: true
          prepare: |
            set -eu
            env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            pkg update -f
            # rust 含 cargo；librsvg2 提供 rsvg-convert（桌面图标派生，缺它 package 腿会跳过）
            pkg install -y rust librsvg2 ca_root_nss
            rustc --version
            cargo --version
          run: |
            set -eu
            WORKSPACE=$(pwd)
            APP=/tmp/bsd-app
            export CARGO_TARGET_DIR=/tmp/polypack-cargo
            POLY="$CARGO_TARGET_DIR/debug/poly"
            LOGS="$WORKSPACE/.polypack/ci-logs/freebsd"
            ART="$WORKSPACE/.polypack/ci-artifacts/freebsd"
            mkdir -p "$LOGS" "$ART"
            run_stage() {
              name=$1; shift
              "$@" >"$LOGS/$name.log" 2>&1
              rc=$?
              cat "$LOGS/$name.log"
              return $rc
            }

            run_stage rustc rustc --version
            run_stage cargo-version cargo --version
            run_stage build cargo build -p poly-cli
            run_stage init "$POLY" init "$APP"
            cd "$APP"
            run_stage poly-build "$POLY" build --target freebsd

            # CI 专用一次性 RSA 密钥：只用于冒烟验证 pkg repo 签名链路，绝不入库/入 artifact。
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/pkg-repo-key.pem
            KEY_B64=$(openssl base64 -A -in /tmp/pkg-repo-key.pem)
            printf '{"keystore":"%s","store_password":"ci-ephemeral","key_alias":"rsa"}' "$KEY_B64" \
              | openssl base64 -A > /tmp/pkg-credential.b64
            POLYPACK_PKG_CRED=$(cat /tmp/pkg-credential.b64)
            export POLYPACK_PKG_CRED

            run_stage release-1 "$POLY" release --target freebsd \
              --credential env:POLYPACK_PKG_CRED --json
            grep -q '"event":"published"' "$LOGS/release-1.log"
            grep -q '"cache_hit":false' "$LOGS/release-1.log"
            find .polypack/release/freebsd -name '*.json' | grep -q .

            # pkg 客户端：file:// 仓库 + PUBKEY 验签（pubkey 由 poly release 从同一私钥导出）
            mkdir -p /tmp/pkg-repos
            cat > /tmp/pkg-repos/polypack.conf <<EOF
            polypack: {
              url: "file://$APP/.polypack/repo",
              signature_type: "pubkey",
              pubkey: "$APP/.polypack/repo/polypack-repo.pub",
              enabled: true
            }
            EOF
            REPOS_DIR=/tmp/pkg-repos
            export REPOS_DIR
            PKG_FILE=$(find "$APP/.polypack/packages/freebsd" -maxdepth 1 -name '*.pkg' -print -quit)
            test -n "$PKG_FILE"
            PKG_NAME=$(pkg query -F "$PKG_FILE" '%n')
            run_stage pkg-update pkg update -f
            run_stage pkg-install pkg install -y "$PKG_NAME"
            run_stage pkg-info pkg info "$PKG_NAME"
            run_stage pkg-check pkg check -s "$PKG_NAME"
            pkg info -l "$PKG_NAME" | grep -q '/usr/local/bin/'

            # 二跑幂等：cache_hit=true、runs=2，仓库文件字节与 mtime 不变
            sha256 .polypack/repo/* > /tmp/repo-before.sha256
            find .polypack/repo -type f -exec stat -f '%N %m %z' {} + | sort > /tmp/repo-before.stat
            run_stage release-2 "$POLY" release --target freebsd \
              --credential env:POLYPACK_PKG_CRED --json
            grep -q '"cache_hit":true' "$LOGS/release-2.log"
            grep -q '"runs":2' "$LOGS/release-2.log"
            sha256 .polypack/repo/* > /tmp/repo-after.sha256
            find .polypack/repo -type f -exec stat -f '%N %m %z' {} + | sort > /tmp/repo-after.stat
            diff -u /tmp/repo-before.sha256 /tmp/repo-after.sha256
            diff -u /tmp/repo-before.stat /tmp/repo-after.stat

            # 归档：包 / 仓库 / 回执 / 全部阶段日志（私钥与凭据载荷不落 artifact）
            cp -R .polypack/packages/freebsd "$ART/packages"
            cp -R .polypack/repo "$ART/repo"
            cp -R .polypack/release "$ART/release"
            cp "$LOGS"/*.log "$ART/"

      - name: 留证据（日志 + pkg 仓库/产物；失败也留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-freebsd-evidence
          path: |
            .polypack/ci-logs/freebsd/**
            .polypack/ci-artifacts/freebsd/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  openbsd:
    name: openbsd / 7.9 / qemu
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: OpenBSD VM（原生构建 + ports 安装冒烟）
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          arch: x86_64
          mem: 6144
          cpu: 4
          copyback: true
          cache-after-prepare: true
          prepare: |
            set -eu
            # OpenBSD 7.9 发行包 rust 低于声明的 rust-version = 1.98：
            # 用 --ignore-rust-version 越过政策声明（升级发行版后移除）。
            pkg_add rust
            rustc --version
          run: |
            set -eu
            WORKSPACE=$(pwd)
            APP=/tmp/bsd-app
            export CARGO_TARGET_DIR=/tmp/polypack-cargo
            POLY="$CARGO_TARGET_DIR/debug/poly"
            LOGS="$WORKSPACE/.polypack/ci-logs/openbsd"
            ART="$WORKSPACE/.polypack/ci-artifacts/openbsd"
            mkdir -p "$LOGS" "$ART"
            run_stage() {
              name=$1; shift
              "$@" >"$LOGS/$name.log" 2>&1
              rc=$?
              cat "$LOGS/$name.log"
              return $rc
            }

            run_stage rustc rustc --version
            run_stage build cargo build -p poly-cli --ignore-rust-version
            run_stage init "$POLY" init "$APP"
            cd "$APP"
            # ports 基础设施此时尚未铺开：打包器只生成骨架并 SKIP make package（如实注记）
            run_stage poly-build "$POLY" build --target openbsd
            PORT_SRC=$(find .polypack/packages/openbsd/ports -mindepth 1 -maxdepth 1 -type d -print -quit)
            test -n "$PORT_SRC"

            # ports 框架（bsd.port.mk）不在 base：装一次后按 ports 目录约定重放 make package
            ftp -o /tmp/ports.tar.gz https://cdn.openbsd.org/pub/OpenBSD/7.9/ports.tar.gz
            tar xzf /tmp/ports.tar.gz -C /usr
            PORT_DST=/usr/ports/x11/$(basename "$PORT_SRC")
            rm -rf "$PORT_DST"
            cp -R "$PORT_SRC" "$PORT_DST"
            mkdir -p /tmp/openbsd-packages

            MAKE_RC=0
            ( cd "$PORT_DST" && make package PACKAGES=/tmp/openbsd-packages ) \
              >"$LOGS/make-package.log" 2>&1 || MAKE_RC=$?
            cat "$LOGS/make-package.log"
            PKG_TGZ=$(find /tmp/openbsd-packages -maxdepth 1 -name '*.tgz' -print -quit)
            if [ "$MAKE_RC" -ne 0 ] || [ -z "$PKG_TGZ" ]; then
              # T-M5-09 评估口径：OpenBSD 真跑环境不可得时 SKIP-with-print，不伪造安装冒烟
              echo "::warning title=OpenBSD make package SKIP::make package 未产出 .tgz（rc=$MAKE_RC）；骨架构建已真跑，安装冒烟按 SKIP 口径跳过（详见 make-package.log）"
            else
              PKG_NAME=$(basename "$PKG_TGZ" .tgz)
              run_stage pkg-add pkg_add "$PKG_TGZ"
              run_stage pkg-info pkg_info "$PKG_NAME"
              run_stage pkg-check pkg_check "$PKG_NAME"
            fi

            cp -R .polypack/packages/openbsd "$ART/packages"
            cp "$LOGS"/*.log "$ART/"

      - name: 留证据（日志 + ports 骨架/产物；失败也留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-openbsd-evidence
          path: |
            .polypack/ci-logs/openbsd/**
            .polypack/ci-artifacts/openbsd/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

name: rust-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 一个宿主失败不掐掉其余宿主，便于一次看清三宿主差异
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple Silicon；windows-2022 与项目文档声明的支持面一致
        os: [ubuntu-latest, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain（stable + rustfmt + clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 构建缓存
        uses: Swatinem/rust-cache@v2

      # 依赖树为纯 Rust（无 *-sys / openssl 等）；以下仅为「测试真跑」所需的系统工具
      # （T-M1-14 图标派生；lintian 在 cargo test 之后单独安装，避免污染通用构建测试）
      - name: 安装测试工具（Linux 真跑）
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick desktop-file-utils

      # T-M1-05：NSIS 真编译。windows-2022 未预装 NSIS；已有 makensis 则复用，否则
      # choco 安装并把 NSIS 目录加入后续步骤 PATH。
      - name: 安装 NSIS（Windows 真跑）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (Test-Path $nsis) {
            $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$nsis;$env:PATH"
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            throw "makensis 安装后仍不可用"
          }
          makensis -VERSION

      # Android 链真跑（runner 自带 SDK）需要现代 JDK：d8 在默认 Java 8 下
      # checkAndLoadMain 失败（windows 腿实证）；与 mobile-contract 的 setup-java 对齐
      - name: 安装 JDK 17（测试真跑：d8/apksigner/bundletool）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # T-M1-05 聚焦真编译：安装步骤已确保 makensis 在 PATH；测试内部仍有 skip 守卫，
      # 仅当工具链真的不可用时才会打印 SKIP。
      - name: NSIS 真编译（聚焦）
        if: runner.os == 'Windows'
        run: cargo test -p poly-bundle --test packagers_windows nsis_real_build_produces_pe_installer -- --nocapture

      # T-M1-05 聚焦冒烟：静默安装 → 启动已安装 PE → 静默卸载。夹具 PE 由宿主 rustc
      # 现编译；测试内部仍有 Windows / makensis / rustc skip 守卫。
      - name: NSIS 安装/启动/卸载冒烟（聚焦）
        if: runner.os == 'Windows'
        run: cargo test -p poly-bundle --test packagers_windows nsis_install_launch_uninstall_smoke -- --nocapture

      - name: cargo test
        # --no-fail-fast：一次看到全部失败面（cargo 默认在首个失败二进制处中止，
        # 会掩盖后续 crate 的问题；三宿主加固期需要全景）
        run: cargo test --workspace --no-fail-fast

      # T-M9-45：只读打包审计（--list 不构建、不上传、不需要 token）。放在 cargo test
      # 之后，registry 缓存已预热，--offline 也不会缺元数据。
      - name: cargo package audit（非发布）
        if: runner.os == 'Linux'
        run: |
          for p in poly-targets poly-cache poly-toolchain poly-core poly-bundle \
                   poly-sign poly-publish poly-plugin poly-cli; do
            echo "== cargo package --list -p $p =="
            cargo package --list -p "$p" --locked --offline
          done

      # T-M9-09：5 目标 --changed 增量发布实测（复用上一步已编译的测试二进制）。
      # 缺 gpg 时测试打印 SKIP；grep 保证 Linux 腿确实跑到测量而非静默跳过。
      - name: release --changed 5 目标实测（Linux 聚焦）
        if: runner.os == 'Linux'
        run: |
          cargo test -p poly-cli --test release five_target_changed -- --nocapture 2>&1 \
            | tee /tmp/release-changed.log
          grep -q "first_published=5 second_published=1" /tmp/release-changed.log

      # T-M1-07 聚焦真跑：工具只在通用 cargo test 之后安装。若提前安装，
      # `poly build` 的 verify 会对测试用 debug deb 触发 lintian 错误，污染通用测试面。
      # appimagetool 固定 1.9.1，按 GitHub release 发布的 sha256 校验后安装（不裸下载）；
      # extract-and-run 让 appimagetool 自身与产物都不依赖 FUSE。
      - name: 安装 AppImage / lintian（Linux 聚焦真跑）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq lintian
          case "$(uname -m)" in
            x86_64)  asset=appimagetool-x86_64.AppImage
                     sha=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 ;;
            aarch64) asset=appimagetool-aarch64.AppImage
                     sha=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158 ;;
            *) echo "不支持的架构：$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL --retry 3 -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/$asset"
          echo "$sha  /tmp/appimagetool" | sha256sum -c -
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: packager 真跑（AppImage + lintian，聚焦）
        if: runner.os == 'Linux'
        run: cargo test -p poly-bundle --test packagers_linux -- --nocapture

      # UI 适配层测试（T-M2-04/05 native；T-M3-05 taro、T-M4-01 tv 同挂）：纯 node:test，
      # 无 npm install 也绿（缺依赖时 skip 不 fail）；目录未落地时跳过（前向兼容新包）
      - name: ui 适配层测试（node --test）
        shell: bash
        run: |
          for dir in ui/adapters/native ui/adapters/taro ui/adapters/tv ui/adapters/roku ui/adapters/wear ui/adapters/garmin; do
            [ -d "$dir" ] || continue
            echo "== $dir =="
            (cd "$dir" && node --test)
          done

      # 供应链检查只需跑一次，固定挂在 Linux 宿主（T-M0-11）
      - name: cargo-deny（licenses / bans / advisories）
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: 安装 cargo-audit
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        if: runner.os == 'Linux'
        run: cargo audit

  # T-M9-53/54：真实 Tauri v2 样例 → WiX MSI → 安装 / 启动 / 卸载 / 残留。
  #
  # 前置：windows-2022 预装 WebView2 Runtime 与 WiX Toolset v3.14（candle / light）。
  # Tauri CLI 非必需：样例前端是已提交的静态 dist，`cargo build --release` 即产出
  # 真实 Tauri exe；MSI 由仓库内 poly-bundle 的 WiX 打包器（candle + light）生成，
  # 这样测试覆盖的是本项目打包器，而不是 `tauri build --bundles msi`。
  # 任何前置缺失都会在本作业内显式失败，测试自身的 SKIP 仅用于本地/降级宿主。
  windows-msi-real:
    name: windows-msi-real / install-launch-uninstall
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      POLY_MSI_REAL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/windows-msi-app/src-tauri -> examples/windows-msi-app/src-tauri/target

      - name: 校验 WebView2 Runtime / WiX v3 前置
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # WebView2 Evergreen Runtime：机器级或用户级注册表任一存在即可。
          $wv2Keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $wv2 = @($wv2Keys | Where-Object { Test-Path $_ } | ForEach-Object {
            (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv
          } | Where-Object { $_ })
          if ($wv2.Count -eq 0) {
            throw 'WebView2 Runtime 缺失：windows-2022 镜像应预装 Evergreen Runtime'
          }
          "WebView2 Runtime: $($wv2 -join ', ')"

          # WiX v3.14：windows-2022 预装；显式定位并把 bin 注入后续步骤 PATH。
          $wixCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'),
            (Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.11\bin'),
            (Join-Path $env:ProgramFiles 'WiX Toolset v3.14\bin')
          )
          $wix = $wixCandidates |
            Where-Object { Test-Path (Join-Path $_ 'candle.exe') } |
            Select-Object -First 1
          if (-not $wix -or -not (Test-Path (Join-Path $wix 'light.exe'))) {
            throw '找不到 WiX v3（candle.exe / light.exe）：windows-2022 应预装 WiX Toolset v3.14'
          }
          $wix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$wix;$env:PATH"
          "WiX: $wix"

      - name: 构建真实 Tauri v2 样例（cargo build --release）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'tauri-build.log'
          cargo build --release --manifest-path examples/windows-msi-app/src-tauri/Cargo.toml 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = (Resolve-Path 'examples/windows-msi-app/src-tauri/target/release/poly-msi-sample.exe').Path
          "POLY_TAURI_CORE_BIN=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "POLY_MSI_REAL_OUT=$(Join-Path $env:RUNNER_TEMP 'poly-msi-real')" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-FileHash $exe -Algorithm SHA256 |
            Format-List |
            Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'sample-exe.sha256') -Encoding utf8
          Write-Host "sample exe: $exe"

      - name: 真实 MSI 安装 / 启动 / 卸载 / 残留
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'msi-real.log'
          cargo test -p poly-bundle --test windows_msi_real -- --nocapture 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # CI 前置已校验，SKIP 在此作业等同于缺少证据：不得把跳过当通过。
          if (Select-String -Path $log -Pattern 'SKIP' -SimpleMatch) {
            throw 'windows-msi-real：测试打印了 SKIP（前置或样例缺失），CI 需要真实证据'
          }

      - name: 记录 MSI 摘要
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'poly-msi-real'
          $sha = Join-Path $env:RUNNER_TEMP 'msi.sha256'
          if (Test-Path $dir) {
            Get-ChildItem $dir -Filter *.msi | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
            } | Out-File -FilePath $sha -Encoding utf8
            if (Test-Path $sha) { Get-Content $sha }
          } else {
            Write-Host "MSI 证据目录不存在（测试在构建前 SKIP 或失败）：$dir"
          }

      - name: 归档日志 / MSI / 摘要
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-real-evidence
          path: |
            ${{ runner.temp }}/tauri-build.log
            ${{ runner.temp }}/msi-real.log
            ${{ runner.temp }}/sample-exe.sha256
            ${{ runner.temp }}/msi.sha256
            ${{ runner.temp }}/poly-msi-real/
          if-no-files-found: warn
          retention-days: 30

name: rust-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 一个宿主失败不掐掉其余宿主，便于一次看清三宿主差异
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple Silicon；windows-2022 与项目文档声明的支持面一致
        os: [ubuntu-latest, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain（stable + rustfmt + clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 构建缓存
        uses: Swatinem/rust-cache@v2

      # 依赖树为纯 Rust（无 *-sys / openssl 等）；以下仅为「测试真跑」所需的系统工具（T-M1-14 图标派生 / deb 校验）
      - name: 安装测试工具（Linux 真跑）
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick desktop-file-utils

      # Android 链真跑（runner 自带 SDK）需要现代 JDK：d8 在默认 Java 8 下
      # checkAndLoadMain 失败（windows 腿实证）；与 mobile-contract 的 setup-java 对齐
      - name: 安装 JDK 17（测试真跑：d8/apksigner/bundletool）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # --no-fail-fast：一次看到全部失败面（cargo 默认在首个失败二进制处中止，
        # 会掩盖后续 crate 的问题；三宿主加固期需要全景）
        run: cargo test --workspace --no-fail-fast

      # UI 适配层测试（T-M2-04/05）：纯 node:test，无 npm install 也绿（缺依赖时 skip 不 fail）
      - name: ui 适配层测试（node --test）
        working-directory: ui/adapters/native
        run: node --test

      # 供应链检查只需跑一次，固定挂在 Linux 宿主（T-M0-11）
      - name: cargo-deny（licenses / bans / advisories）
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: 安装 cargo-audit
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        if: runner.os == 'Linux'
        run: cargo audit

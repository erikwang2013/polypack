name: rust-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 一个宿主失败不掐掉其余宿主，便于一次看清三宿主差异
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple Silicon；windows-2022 与项目文档声明的支持面一致
        os: [ubuntu-latest, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain（stable + rustfmt + clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 构建缓存
        uses: Swatinem/rust-cache@v2

      # 依赖树为纯 Rust（无 *-sys / openssl 等）；以下仅为「测试真跑」所需的系统工具
      # （T-M1-14 图标派生；lintian 在 cargo test 之后单独安装，避免污染通用构建测试）
      - name: 安装测试工具（Linux 真跑）
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick desktop-file-utils

      # T-M1-05：NSIS 真编译。windows-2022 未预装 NSIS；已有 makensis 则复用，否则
      # choco 安装并把 NSIS 目录加入后续步骤 PATH。
      - name: 安装 NSIS（Windows 真跑）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (Test-Path $nsis) {
            $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$nsis;$env:PATH"
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            throw "makensis 安装后仍不可用"
          }
          makensis -VERSION

      # Android 链真跑（runner 自带 SDK）需要现代 JDK：d8 在默认 Java 8 下
      # checkAndLoadMain 失败（windows 腿实证）；与 mobile-contract 的 setup-java 对齐
      - name: 安装 JDK 17（测试真跑：d8/apksigner/bundletool）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # T-M1-05 聚焦真编译：安装步骤已确保 makensis 在 PATH；测试内部仍有 skip 守卫，
      # 仅当工具链真的不可用时才会打印 SKIP。
      - name: NSIS 真编译（聚焦）
        if: runner.os == 'Windows'
        run: cargo test -p poly-bundle --test packagers_windows nsis_real_build_produces_pe_installer -- --nocapture

      - name: cargo test
        # --no-fail-fast：一次看到全部失败面（cargo 默认在首个失败二进制处中止，
        # 会掩盖后续 crate 的问题；三宿主加固期需要全景）
        run: cargo test --workspace --no-fail-fast

      # T-M1-07 聚焦真跑：工具只在通用 cargo test 之后安装。若提前安装，
      # `poly build` 的 verify 会对测试用 debug deb 触发 lintian 错误，污染通用测试面。
      # appimagetool 固定 1.9.1，按 GitHub release 发布的 sha256 校验后安装（不裸下载）；
      # extract-and-run 让 appimagetool 自身与产物都不依赖 FUSE。
      - name: 安装 AppImage / lintian（Linux 聚焦真跑）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq lintian
          case "$(uname -m)" in
            x86_64)  asset=appimagetool-x86_64.AppImage
                     sha=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 ;;
            aarch64) asset=appimagetool-aarch64.AppImage
                     sha=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158 ;;
            *) echo "不支持的架构：$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL --retry 3 -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/$asset"
          echo "$sha  /tmp/appimagetool" | sha256sum -c -
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: packager 真跑（AppImage + lintian，聚焦）
        if: runner.os == 'Linux'
        run: cargo test -p poly-bundle --test packagers_linux -- --nocapture

      # UI 适配层测试（T-M2-04/05 native；T-M3-05 taro、T-M4-01 tv 同挂）：纯 node:test，
      # 无 npm install 也绿（缺依赖时 skip 不 fail）；目录未落地时跳过（前向兼容新包）
      - name: ui 适配层测试（node --test）
        shell: bash
        run: |
          for dir in ui/adapters/native ui/adapters/taro ui/adapters/tv ui/adapters/roku ui/adapters/wear ui/adapters/garmin; do
            [ -d "$dir" ] || continue
            echo "== $dir =="
            (cd "$dir" && node --test)
          done

      # 供应链检查只需跑一次，固定挂在 Linux 宿主（T-M0-11）
      - name: cargo-deny（licenses / bans / advisories）
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: 安装 cargo-audit
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        if: runner.os == 'Linux'
        run: cargo audit

# 桥真跑（T-M2-01 / T-M2-02）：每夜在 ubuntu 上真生成 Kotlin + Swift 绑定、真用 NDK 交叉
# 编译 arm64-v8a / x86_64 的 .so、真组装 AAR、真用 kotlinc 编 classes.jar。
#
# 为什么单独一个 workflow：主闸 `rust-ci.yml` 的三宿主 `cargo test --workspace` 只跑无工具面
# （UDL / 摘要 / AAR 布局 / 缓存命中，见 `poly-core/tests/bridge.rs`）；真跑要装 Android SDK +
# NDK（约 1 GB）并真编译 uniffi 夹具（分钟级），只在每夜与手动触发时付这个代价。
#
# 不覆盖 Swift 编译：`swiftc` 不在 ubuntu 上（Linux 宿主无从编译 Swift 绑定）——绑定生成本身
# 已在本作业真跑并做结构断言，Swift 侧编译留待 macOS 作业（T-M2-03 的 XCFramework 腿）接入。
# iOS 侧绑定的消费契约见 `crates/poly-bundle/src/packagers/ios/swift.rs`。

name: bridge-real

on:
  schedule:
    # 每夜真实模式：避开整点与 mobile-contract 的 18:37（UTC 19:23）
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: bridge / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      POLY_CONTRACT_REAL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain（stable + rustfmt）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-linux-android, x86_64-linux-android

      - name: 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: Android SDK（cmdline-tools + sdkmanager）
        # v3→v4：v3 默认 packages 含早已下架的死包 `tools`（本 workflow 两次 dispatch 的真根因，
        # 与 mobile-contract 同款修复——那边白天已换 v4，这边今夜首次真派才发现漏网）。
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: "false"

      - name: NDK（真跑：JNI .so 的链接器）
        # 装进 SDK 根的 ndk/：与生产探测同路径（$ANDROID_NDK_HOME → <sdk>/ndk/<版本最大>），
        # 不额外钉环境变量——CI 走的发现路径与开发者本机就是同一条。
        run: sdkmanager "ndk;27.0.12077973"

      # Kotlin 绑定要真编译成 classes.jar：kotlinc + JNA 落工具缓存即被自动发现
      # （crates/poly-core/src/bridge/kotlinc.rs 的定位顺序；缺则按 skip-if-missing 跳过该步）。
      # 用官方发行包（自带 stdlib/reflect/coroutines）而非 kotlin-compiler-embeddable-*.jar：
      # 后者只保证被 Gradle 之类备齐依赖的宿主使用，直接 `java -cp` 起会一路 NoClassDefFoundError。
      - name: kotlinc + JNA（真跑：classes.jar）
        run: |
          tools="$HOME/.cache/polypack/tools/kotlin"
          mkdir -p "$tools"
          curl -sSL -o /tmp/kotlin-compiler.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
          unzip -q -o /tmp/kotlin-compiler.zip -d "$tools"   # 解出 kotlinc/bin/kotlinc
          curl -sSL -o "$tools/jna-5.14.0.jar" \
            https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar
          "$tools/kotlinc/bin/kotlinc" -version
          ls -l "$tools"

      - name: 桥真跑（生成 + 交叉编译 + AAR + classes.jar）
        # 单线程：真跑会各自建 uniffi 夹具的 target 目录，串行更省磁盘与网络
        run: cargo test -p poly-core --test bridge_real --no-fail-fast -- --nocapture --test-threads=1

      - name: 无工具面回归（判据不因真跑而漂）
        run: |
          cargo test -p poly-core --test bridge --no-fail-fast -- --nocapture
          cargo test -p poly-cli --test bridge --no-fail-fast -- --nocapture

      - name: 留产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-real-artifacts
          path: /tmp/polypack-bridge-real-*/**
          if-no-files-found: warn
          retention-days: 14

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    name: secret-scan / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 一个宿主失败不掐掉其余宿主，便于一次看清三宿主差异
    strategy:
      fail-fast: false
      matrix:
        # 与 rust-ci 同一支持面：secret-scan 是三个宿主上必需的检查
        os: [ubuntu-latest, macos-14, windows-2022]
    steps:
      # 全历史扫描需要完整对象库：浅克隆会被 scan 按「跳过 + 原因」处理，等于没查历史
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust toolchain（stable）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 构建缓存
        uses: Swatinem/rust-cache@v2

      # 提交钩子（polypack scan --install-hook）与 CI 跑的是同一实现；命中 → 退出码 1 → 作业失败
      - name: polypack scan（工作区 + git 全历史）
        run: cargo run -p polypack-cli -- scan --dir . --history

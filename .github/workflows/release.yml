name: release

# 预编译 `poly` 二进制：tag `v*` 推送时构建三宿主产物并附加到 GitHub Release。
# 源码安装仍是主路径（`cargo install --path crates/poly-cli`）；本工作流只解决
# 「没有 Rust 工具链的用户如何拿到 CLI」这一分发缺口。
#
# 可选签名：配置 MINISIGN_SECRET_KEY（base64 编码的 minisign 私钥文件）后，
# publish 作业生成 SHA256SUMS.txt.minisig；未配置时明确跳过，不伪造密钥。
# 安装脚本与校验说明见 docs/INSTALL.md / docs/INSTALL.en.md。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (workflow_dispatch builds only)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

jobs:
  build:
    name: build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 校验 tag 与 Cargo 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "poly-cli") | .version')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 poly-cli 版本 v$version 不一致" >&2
            exit 1
          fi
          echo "版本一致：v$version"

      - name: 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 构建 poly（release）
        run: cargo build --release -p poly-cli --bin poly

      - name: 打包（Unix）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/poly "dist/poly-${{ matrix.target }}"
          tar -C dist -czf "dist/poly-${{ matrix.target }}.tar.gz" "poly-${{ matrix.target }}"
          rm "dist/poly-${{ matrix.target }}"

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/poly.exe "dist/poly-${{ matrix.target }}.exe"
          Compress-Archive -Path "dist/poly-${{ matrix.target }}.exe" -DestinationPath "dist/poly-${{ matrix.target }}.zip" -Force
          Remove-Item "dist/poly-${{ matrix.target }}.exe"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: poly-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  linux-packages:
    name: packages / linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装打包工具
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools

      - name: 构建 poly（release）
        run: cargo build --release -p poly-cli --bin poly

      - name: 构建 .deb
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          mkdir -p dist
          packaging/linux/build-deb.sh target/release/poly "$version" \
            "dist/polypack-cli_${version}_amd64.deb" amd64

      - name: 下载 appimagetool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

      - name: 构建 AppImage
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          packaging/linux/build-appimage.sh target/release/poly "$version" \
            /tmp/appimagetool "dist/poly-${version}-x86_64.AppImage"

      - name: 验证 Linux 包
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          dpkg-deb -I "dist/polypack-cli_${version}_amd64.deb"
          chmod +x dist/*.AppImage
          (cd /tmp && rm -rf squashfs-root && \
            "$GITHUB_WORKSPACE/dist/poly-${version}-x86_64.AppImage" --appimage-extract >/dev/null && \
            ./squashfs-root/AppRun --version)

      - name: 上传 Linux 安装包
        uses: actions/upload-artifact@v4
        with:
          name: poly-linux-packages
          path: dist/*
          if-no-files-found: error

  windows-installer:
    name: package / windows MSI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 构建 poly（release）
        run: cargo build --release -p poly-cli --bin poly

      - name: 构建 MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $base = ($version -split '-')[0]
          New-Item -ItemType Directory -Force dist | Out-Null
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'),
            (Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.11\bin'),
            (Join-Path $env:ProgramFiles 'WiX Toolset v3.14\bin')
          )
          $wix = $candidates | Where-Object { Test-Path (Join-Path $_ 'candle.exe') } | Select-Object -First 1
          if (-not $wix -or -not (Test-Path (Join-Path $wix 'light.exe'))) {
            throw 'WiX v3 (candle.exe / light.exe) not found'
          }
          & (Join-Path $wix 'candle.exe') -arch x64 "-dVersion=$base" "-dSourceDir=$PWD\target\release" \
            packaging\windows\poly.wxs -out dist\poly.wixobj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $wix 'light.exe') dist\poly.wixobj -out "dist\poly-$version-x86_64.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 安装 / 运行 / 卸载冒烟
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI not built' }
          Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart') -Wait
          $exe = Join-Path $env:ProgramFiles 'PolyPack\poly.exe'
          if (-not (Test-Path $exe)) { throw "installed poly.exe not found: $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Process msiexec.exe -ArgumentList @('/x', $msi.FullName, '/qn', '/norestart') -Wait
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $env:ProgramFiles 'PolyPack')) { throw 'uninstall residue' }

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: poly-windows-installer
          path: dist/*.msi
          if-no-files-found: error

  macos-pkg:
    name: package / macOS pkg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 构建 poly（release）
        run: cargo build --release -p poly-cli --bin poly

      - name: 构建 .pkg
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          base="${version%%-*}"
          mkdir -p dist
          packaging/macos/build-pkg.sh target/release/poly "$base" \
            "dist/poly-${version}-aarch64.pkg"

      - name: 安装并运行冒烟
        shell: bash
        run: |
          set -euo pipefail
          sudo installer -pkg dist/*.pkg -target /
          /usr/local/bin/poly --version
          sudo rm -f /usr/local/bin/poly
          sudo pkgutil --forget dev.polypack.cli || true

      - name: 上传 macOS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: poly-macos-pkg
          path: dist/*.pkg
          if-no-files-found: error

  publish:
    name: publish / GitHub Release
    needs: [build, linux-packages, windows-installer, macos-pkg]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      # 只有配置了 MINISIGN_SECRET_KEY 才签名；该表达式只暴露布尔值，不泄露 secret。
      HAS_MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 可选签名（minisign）
        if: env.HAS_MINISIGN_KEY == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          command -v minisign >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq minisign
          }
          install -d -m 700 "$RUNNER_TEMP/minisign"
          printf '%s' "$MINISIGN_SECRET_KEY" | base64 -d > "$RUNNER_TEMP/minisign/minisign.key"
          chmod 600 "$RUNNER_TEMP/minisign/minisign.key"
          minisign -Sm dist/SHA256SUMS.txt -s "$RUNNER_TEMP/minisign/minisign.key"
          rm -rf "$RUNNER_TEMP/minisign"

      - name: 签名跳过说明
        if: env.HAS_MINISIGN_KEY != 'true'
        shell: bash
        run: echo "MINISIGN_SECRET_KEY 未配置 — 跳过二进制签名；发布物仅含 SHA-256 校验和（见 docs/INSTALL.md）。"

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --generate-notes --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi

  install-smoke:
    name: install-smoke / linux-x86_64
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 用安装脚本安装刚发布的 Linux 资产
        env:
          POLY_VERSION: ${{ github.ref_name }}
          POLY_INSTALL_DIR: ${{ runner.temp }}/poly-bin
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install.sh
          installed=$("$POLY_INSTALL_DIR/poly" --version)
          echo "$installed"
          expected="poly ${POLY_VERSION#v}"
          if [ "$installed" != "$expected" ]; then
            echo "安装版本不符：期望 $expected，实际 $installed" >&2
            exit 1
          fi

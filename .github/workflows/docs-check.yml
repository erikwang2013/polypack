name: docs-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # archify 为公开渲染器；拉取后由 render-diagrams.mjs --check 使用
      - name: Fetch archify renderer
        continue-on-error: true
        run: git clone --depth 1 https://github.com/tt-a1i/archify /tmp/archify

      - name: Pax assets drift check
        run: node tools/build-pax.mjs --check

      - name: Diagram drift check
        run: |
          if [ -f /tmp/archify/bin/archify.mjs ]; then
            ARCHIFY_BIN=/tmp/archify/bin/archify.mjs node tools/render-diagrams.mjs --check
          else
            echo "archify unavailable — diagram drift check skipped"
          fi

      - name: Bilingual structure check
        run: node tools/check-docs.mjs

      - name: Environment slot ledger check
        run: node tools/check-env-slots.mjs

      - name: SVG XML validation
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          for f in docs/assets/*.svg docs/assets/en/*.svg; do xmllint --noout "$f"; done
          echo "all SVGs valid"

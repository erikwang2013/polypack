# 供应链策略（T-M0-11）。由 CI 的 cargo-deny-action 与本地 `cargo deny check` 读取。
# schema 对照 cargo-deny 0.20.2 的 deny.template.toml（该版本无 `version = 2` 字段）。

[advisories]
# 漏洞（RUSTSEC vulnerability）恒为 error，无需开关，本段存在的意义是显式声明检查启用。
# 其余保持默认：unmaintained 全图检查、unsound 限工作区、yanked = warn。
ignore = [
    # RUSTSEC-2023-0071：rsa crate 的 Marvin 计时侧信道——RustCrypto 无修复版本
    # （"No safe upgrade is available"）。本仓用途仅本地对自有私钥做 PKCS#1 v1.5 **签名**
    # （T-M3-09 微信 CI 协议），不含服务端解密面。触发复查：引入 RSA 解密路径、或上游出修复版。
    # 同款豁免见 .cargo/audit.toml（cargo-audit 腿；两处须一致）。
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0370 / 0371 / 0372：zbus 5.19 仍以独立 crate 形式携带
    # zvariant / zvariant_derive / zbus_names（上游自 zbus 6.0 起才合并进 zbus）。
    # 本仓仅经 keyring 4.2 的 zbus-secret-service 在 Linux 会话总线读凭据，
    # 无网络 / 跨信任边界面；上游标注 unmaintained（非漏洞），当前无安全升级版。
    # 升级路径 = keyring / secret-service 迁移到 zbus 6；触发复查：该链路升级。
    # 同款豁免见 .cargo/audit.toml（cargo-audit 腿；两处须一致）。
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[bans]
# 禁通配版本依赖（"*"）
wildcards = "deny"
# 工作区内部 path 依赖天然写作 "*"（poly-cli -> poly-core 等），放行这类非 registry 依赖
allow-wildcard-paths = true

[sources]
# 只接受 crates.io 与显式声明的来源，防依赖混淆 / 换源投毒
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
allow = [
    "Apache-2.0",
    # wasmtime / cranelift / wasmparser 全系（T-M8-01 插件沙箱）：Apache-2.0 + LLVM 例外，
    # 仍是宽松许可；cargo-deny 按完整 SPDX 表达式匹配，故单列。
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

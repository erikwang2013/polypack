<svg width="640" height="384" viewBox="0 0 720 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pax-t pax-d">
  <title id="pax-t">Pax · 打包机器人 — 哭表情（动态）</title>
  <desc id="pax-d">PolyPack 项目宠物 Pax 的哭表情（crying），带该表情专属的 CSS 动效；减弱动态效果时定格为静态形态。</desc>
  <style>@media (prefers-reduced-motion: no-preference) {
    .pax-bot { animation: pax-bob 4s ease-in-out infinite; }
    .pax-tear-a { animation: pax-tear 1.15s ease-in infinite; }
    .pax-tear-b { animation: pax-tear 1.15s ease-in 0.2s infinite; }
  }
  @keyframes pax-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes pax-tear { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(12px); opacity: 0; } }
  </style>

  <defs>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">PolyPack — 多端打包，一次送达 / Package once, deliver everywhere</title>
  <desc id="d">PolyPack 双语社交预览：Rust 核心、React UI 适配层与 49 个目标平台。PolyPack bilingual social preview: a Rust core, React UI adapters and 49 target platforms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0a1a2c"/><stop offset="1" stop-color="#0f2f44"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".6" stop-color="#6ee7b7"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".8" cy=".2" r=".7">
      <stop offset="0" stop-color="#0891b2" stop-opacity=".45"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pet-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g opacity=".2" stroke="#22d3ee" fill="none" stroke-width="2">
    <rect x="800" y="96" width="150" height="150" rx="18" transform="rotate(12 875 171)"/>
    <rect x="930" y="330" width="110" height="110" rx="14" transform="rotate(-14 985 385)"/>
    <rect x="700" y="430" width="90" height="90" rx="12" transform="rotate(8 745 475)"/>
  </g>

  <ellipse cx="930" cy="250" rx="260" ry="190" fill="url(#pet-glow)"/>
  <image href="pax.png" x="750" y="130" width="360" height="216" preserveAspectRatio="xMidYMid meet"/>

  <text x="72" y="82" font-family="Inter, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#67e8f9">POLYPACK · RUST × REACT · 49 TARGETS</text>

  <text x="70" y="184" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="66" font-weight="800" fill="#ffffff">多端打包，</text>
  <text x="70" y="256" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="66" font-weight="800" fill="url(#ink)">一次送达。</text>

  <text x="74" y="316" font-family="Inter, 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="32" font-weight="700" fill="#e2e8f0">Package once. Deliver everywhere.</text>

  <text x="74" y="380" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#cbd5e1">Rust 核心 × React UI 适配层 × 49 个目标平台</text>
  <text x="74" y="412" font-family="Inter, 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="19" fill="#94a3b8">Rust core × React UI adapters × 49 target platforms</text>

  <g font-family="Inter, 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="17" fill="#94a3b8">
    <text x="74" y="506">SBOM · signed releases · OTA · plugin sandbox · self-hosted farm</text>
    <text x="74" y="536">v2.0.1 · Apache-2.0 · package.erik.xyz/polypack</text>
  </g>

  <g transform="translate(74 558)">
    <rect width="238" height="40" rx="20" fill="#22d3ee"/>
    <text x="119" y="26" text-anchor="middle" font-family="Inter, 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="15" font-weight="800" fill="#05202b">GET STARTED · 开始使用 ↓</text>
  </g>
</svg>

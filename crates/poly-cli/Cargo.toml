[package]
name = "poly-cli"
description = "PolyPack 命令行入口"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "poly"
path = "src/main.rs"

[dependencies]
poly-bundle.workspace = true
poly-cache.workspace = true
poly-core.workspace = true
# T-M8-04：`poly plugin digest` 复用宿主 SRI 口径（content_digest）；e2e 测试用 Sandbox。
# T-M8-05：build / verify / package 经统一 ProviderRegistry 调用插件 provider。
poly-plugin.workspace = true
poly-publish.workspace = true
poly-sign.workspace = true
poly-targets.workspace = true
poly-toolchain.workspace = true
base64.workspace = true
clap.workspace = true
# T-M9-41：插件索引版本解析 / 排序（SemVer 2.0.0）。
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# T-M5-05 仓库元数据：Release/Packages/repomd 的 SHA256 与 repodata gzip（纯 Rust，无 C 依赖）。
sha2 = "0.10"
flate2 = "1"

[dev-dependencies]
serde_json.workspace = true
# T-M8-04：digest 口径用宿主同一 blake3 实现独立复算。
blake3.workspace = true

# ENV-15：CLI keyring 信任根 E2E 的写 / 删侧。读写后端本体只读，条目得直接用 keyring
# crate 种；同版本同特性 = 与 poly-sign 依赖侧共用编译实例，测试文件本身 `cfg(linux)`。
[target.'cfg(target_os = "linux")'.dev-dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[lints]
workspace = true

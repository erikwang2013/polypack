# PolyPack 工程配置（schema 版本见顶层 schema 字段；字段清单见 `poly doctor` 报告）
schema = 1

[package]
name = "polypack-app"
version = "0.1.0"

[ui]
# 模板 UI 是 React + vite 骨架；framework 目前只作文档（M1 无分支依赖它）
framework = "react"
entry = "ui/index.html"
# PWA theme_color（manifest 用；缺省为 Pax 品牌橙）
theme_color = "#ea580c"

[core]
crate = "core"

# L1 四端目标：windows / macos / linux / web
# format 覆盖注册表默认格式（M1 只有这一个字段可覆盖；值如 linux 的 deb / appimage、
# web 的 static-site，非法值由打包器报错）
[targets.windows]
format = "msi"

[targets.macos]
format = "dmg"

[targets.linux]
format = "appimage"

[targets.web]
format = "static-site"

# 清理与保留策略（§5.5）：超限 LRU 自动淘汰
[retention]
cache_days = 30
cache_gib = 20
artifact_builds = 10

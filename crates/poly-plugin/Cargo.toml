[package]
name = "poly-plugin"
description = "PolyPack WASM 插件宿主（M8：自定义目标）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
poly-core.workspace = true
poly-targets.workspace = true
blake3.workspace = true
thiserror.workspace = true
# T-M8-01：组件模型沙箱（版本与 feature 见根清单 workspace.dependencies）。
wasmtime.workspace = true
# 出网能力（显式授权域名）：与 poly-sign / poly-publish 同版本同特性，不引入新的第三方树。
# 关默认 rustls：根证书由 rustls-native-certs 系统信任库提供给 `RootCerts::Specific`
# （同 poly-publish 的许可证/信任链理由）。重定向由调用侧禁用，避免越过域名白名单。
ureq = { version = "3.4", default-features = false, features = [
    "rustls-no-provider",
    "_ring",
] }
rustls-native-certs = "0.8"

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW`：写文件最后一跳拒绝符号链接（父路径已 canonicalize 校验）。
libc = "0.2"

[lints]
workspace = true

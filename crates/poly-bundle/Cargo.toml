[package]
name = "poly-bundle"
description = "PolyPack 打包器矩阵（M1+：apk / ipa / msi / dmg / deb / wgt / …）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
poly-targets.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# SRI 哈希只认 sha256/384/512（T-M1-08），RustCrypto 纯 Rust 实现无 C 依赖。
sha2 = "0.10"
zip = { workspace = true }
# `.ipk` 的 control.tar.gz / data.tar.gz（T-M4-09）：zip 的 deflate 特性已把 flate2 带进
# 锁文件（1.1.10），此处只升为直接依赖，不新增下载 / 版本声明。
flate2 = "1.1"

[lints]
workspace = true

[package]
name = "poly-publish"
description = "PolyPack 商店与平台发布客户端（M2+）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
poly-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
# 载荷契约 base64(JSON)；版本统一在根清单 workspace.dependencies（poly-cli / poly-sign 共用同一份编译产物）。
base64.workspace = true
# 代码包 zip（小程序上传体）；与 poly-bundle 同版本同 feature，不引入新的第三方树。
zip = { workspace = true }
# 上传体 gzip（微信 servicewechat 上传口径：pack 后的容器 gzip 再 POST）。
# flate2 已随 zip 的 deflate 特性进树，此处只作直接引用。
flate2 = "1"
# URL query / 表单值百分号编码（口径同 Node querystring / encodeURIComponent）。
# 已随 ureq-proto 进树，此处只作直接引用。
percent-encoding = "2"
# 微信代码上传密钥签名 = Node `crypto.privateEncrypt(RSA_PKCS1_PADDING)` 的等价物
# （raw PKCS#1 v1.5 私钥运算，不带 DigestInfo；ring 不暴露无摘要原语）。
# 纯 Rust（RustCrypto），许可证 MIT OR Apache-2.0 在 deny.toml 白名单内。
rsa = "0.9"
# 真实平台 HTTP（ureq 3.4，与 poly-sign::vault 同款配置）。**关默认特性**：默认的
# `rustls` 特性会拉 webpki-roots / webpki-root-certs（许可证不在 deny.toml 白名单，见
# poly-sign/Cargo.toml 的同一注释）→ 改由本 crate 显式给 `RootCerts::Specific`：
# 系统信任库（rustls-native-certs，纯 Rust）或 http:// 不读。
ureq = { version = "3.4", default-features = false, features = [
    "rustls-no-provider",
    "_ring",
] }
rustls-native-certs = "0.8"
# RSA-SHA256 请求签名（支付宝 RSA2 网关签名）+ 随机数（微信 getrandstr 的 clientRand）。
# ring 已随 ureq 的 `_ring` 特性进树（poly-sign 同一路径），此处只作直接引用。
ring = "0.17"

[lints]
workspace = true

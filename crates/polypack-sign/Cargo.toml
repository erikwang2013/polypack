[package]
name = "polypack-sign"
description = "PolyPack 签名 / 公证 / 加固（M2+）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
polypack-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# 载荷契约 base64(JSON)；版本统一在根清单 workspace.dependencies（polypack-cli / polypack-publish 共用同一份编译产物）。
base64.workspace = true

# 真实 Vault HTTP 客户端（T-M2-11 真环境闭环，`vault server -dev`）。**关默认特性**：
# 默认的 `rustls` 特性会拉 webpki-roots / webpki-root-certs（许可证 CDLA-Permissive-2.0，
# 不在 deny.toml 白名单，且 webpki-root-certs 只在 wasm32 目标出现 = 永不被编译的
# 纯策略噪音）→ 关掉自带根证书，改由本 crate 显式给 `RootCerts::Specific`：
# 系统信任库（rustls-native-certs，纯 Rust；企业内网 CA 生效）或 `VAULT_CACERT`。
# 加密提供者用 ring（`_ring` 是 ureq 为此开的公共钩子：ring 为 vendored C，无系统库依赖）。
ureq = { version = "3.4", default-features = false, features = [
    "rustls-no-provider",
    "_ring",
] }
# 系统信任库读取（https 且未设 VAULT_CACERT 时）。Linux/macOS：openssl-probe +
# security-framework；Windows：schannel API——许可证全在 deny.toml 白名单内。
rustls-native-certs = "0.8"

# keyring v4 的 `v1` 兼容特性暴露与 v3 相同的 `Entry` API，且按目标平台自动选后端：
# Linux / *nix 用 zbus-secret-service（纯 Rust，只依赖会话总线，不链系统 libdbus），
# macOS = Keychain，Windows = Credential Manager；不支持的平台 Entry::new 返回
# NoDefaultStore（`available()` 报错并提示改用 Env / Memory 注入），仍可编译。
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
# 其余平台（BSD 等）：`v1` 在非 macOS / iOS / Android 的 *nix 上同样启用 zbus 后端。
[target.'cfg(not(any(target_os = "linux", target_os = "macos", target_os = "windows")))'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[dev-dependencies]
# 测试自造最小 APK（zip 容器）；与 polypack-bundle 同版本同 feature，不引入新的第三方树。
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

# 真总线闭环（tests/keyring_real.rs）的写 / 删侧：`KeyringBackend` 本体只读，写删得直接
# 用 keyring crate。同版本同特性 = 与依赖侧共用同一编译实例，不引入新的第三方树；
# 只在 Linux 声明（真跑形态是 headless secret-service，测试文件本身也 `cfg(linux)`）。
[target.'cfg(target_os = "linux")'.dev-dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[lints]
workspace = true

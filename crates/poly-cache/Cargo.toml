[package]
name = "poly-cache"
description = "PolyPack 内容寻址构建缓存（M1+）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["std"]
# T-M6-01：`--no-default-features` 下只保留摘要与缓存键（no_std + alloc）；
# 磁盘缓存、目录树摘要与保留策略依赖文件系统，留在 std feature 后。
# S3 / OSS 兼容后端同样只在 std 下编译（HTTP + TLS + 凭证环境）。
std = [
    "blake3/std",
    "dep:serde_json",
    "dep:ureq",
    "dep:rustls-native-certs",
    "dep:hmac",
    "dep:sha2",
    "dep:percent-encoding",
    "serde/std",
    "thiserror/std",
]

[dependencies]
blake3 = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = ["alloc"] }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, default-features = false }
# S3 兼容对象存储（poly-cache::s3）：SigV4 直连，不引入 AWS SDK。
# ureq 3.4 与 poly-sign / poly-publish / poly-plugin 同版本同特性：关默认 rustls
# （webpki-roots 许可证不在 deny.toml 白名单），根证书显式给系统信任库。
ureq = { version = "3.4", default-features = false, features = [
    "rustls-no-provider",
    "_ring",
], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
# SigV4：HMAC-SHA256 链 + 载荷 SHA-256（RustCrypto，已随既有依赖树锁定）。
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
# 规范 URI / query 的百分号编码（已随 ureq-proto 进树，此处只作直接引用）。
percent-encoding = { version = "2", optional = true }

[dev-dependencies]
# 契约测试从原始请求独立重算 SigV4（mock 服务端 403 判据）。同版本同锁条目，
# 不引入新的第三方包。
hmac = "0.12"
sha2 = "0.10"
percent-encoding = "2"

[lints]
workspace = true

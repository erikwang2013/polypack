[package]
name = "poly-updater-sample"
version = "0.1.0"
description = "Tauri v2 self-hosted updater sample used by the real update/rollback drill (T-M9-12)"
edition = "2021"

# Standalone workspace: examples/ is intentionally not a member of the PolyPack
# workspace (`members = ["crates/*"]`), so the sample resolves its own Tauri
# dependency tree and lockfile without touching the main workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# `tauri::generate_context!` resolves plugin config through `serde_json`; a
# merged config that carries `plugins.updater` needs it as a direct dependency.
serde_json = "1"
# Pinned to the updater API used by the drill (builder + version comparator).
# `default` includes the zip feature needed to unpack the Windows NSIS archive.
tauri-plugin-updater = "2.14"
